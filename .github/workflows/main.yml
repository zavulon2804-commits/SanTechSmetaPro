name: Build SanTechSmetaPro Windows Installer v2.0.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Check source archive
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE 'SanTechSmetaPro_v2.0.1_Hotfix_WindowsReady.zip'

          if (-not (Test-Path $zip)) {
            Write-Host "Files in repository root:"
            Get-ChildItem $env:GITHUB_WORKSPACE
            throw "Archive not found: $zip"
          }

          Write-Host "Source archive found:"
          Get-Item $zip | Format-List Name, Length, FullName

      - name: Unpack project
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE 'SanTechSmetaPro_v2.0.1_Hotfix_WindowsReady.zip'
          $dst = Join-Path $env:GITHUB_WORKSPACE 'buildsrc'

          if (Test-Path $dst) {
            Remove-Item $dst -Recurse -Force
          }

          New-Item -ItemType Directory -Path $dst -Force | Out-Null

          Expand-Archive `
            -Path $zip `
            -DestinationPath $dst `
            -Force

          if (-not (Test-Path "$dst\SanTechSmeta.sln")) {
            throw "SanTechSmeta.sln not found after unpack."
          }

          if (-not (Test-Path "$dst\scripts\build-installer.ps1")) {
            throw "build-installer.ps1 not found after unpack."
          }

          Write-Host "Project unpacked successfully."

      - name: Build, test, publish, smoke-test and create installer
        shell: pwsh
        run: |
          Set-Location "$env:GITHUB_WORKSPACE\buildsrc"

          .\scripts\build-installer.ps1

          if ($LASTEXITCODE -ne 0) {
            throw "build-installer.ps1 failed."
          }

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Join-Path `
            $env:GITHUB_WORKSPACE `
            'buildsrc\artifacts\installer\SanTechSmetaPro-Setup-v2.0.0.exe'

          if (-not (Test-Path $installer)) {
            Write-Host "Installer directory:"

            $dir = Join-Path `
              $env:GITHUB_WORKSPACE `
              'buildsrc\artifacts\installer'

            if (Test-Path $dir) {
              Get-ChildItem $dir -Recurse |
                Select-Object FullName, Length
            }

            throw "Installer was not created."
          }

          $file = Get-Item $installer

          Write-Host ""
          Write-Host "=================================="
          Write-Host "INSTALLER CREATED SUCCESSFULLY"
          Write-Host "=================================="
          Write-Host "File: $($file.Name)"
          Write-Host "Size: $([math]::Round($file.Length / 1MB, 2)) MB"

          $hash = Get-FileHash `
            -Path $installer `
            -Algorithm SHA256

          Write-Host "SHA256:"
          Write-Host $hash.Hash
          Write-Host "=================================="

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: SanTechSmetaPro-Windows-Installer-v2.0.1
          path: |
            buildsrc/artifacts/installer/SanTechSmetaPro-Setup-v2.0.0.exe
            buildsrc/artifacts/installer/BUILD_REPORT.txt
            buildsrc/artifacts/installer/SMOKE_TEST_REPORT.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SanTechSmetaPro-win-x64-portable-v2.0.1
          path: buildsrc/artifacts/win-x64/**
          if-no-files-found: error
          retention-days: 14
