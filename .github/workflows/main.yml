name: Build SanTechSmetaPro Windows Installer v2.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Unpack project
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE 'SanTechSmetaPro_v2.0_VisualWorkflow_WindowsReady.zip'
          if (-not (Test-Path $zip)) { throw "Archive not found: $zip" }
          $dst = Join-Path $env:GITHUB_WORKSPACE 'buildsrc'
          if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $dst -Force

      - name: Apply MainWindow initialization hotfix
        shell: pwsh
        run: |
          $file = Join-Path $env:GITHUB_WORKSPACE 'buildsrc\src\SanTechSmeta.App\MainWindow.xaml.cs'
          $text = Get-Content $file -Raw
          $pattern = '(?s)(public MainWindow\(MainWindowViewModel viewModel, IServiceProvider serviceProvider\)\s*\{\s*)InitializeComponent\(\);\s*_viewModel = viewModel;\s*_serviceProvider = serviceProvider;'
          $replacement = '$1_viewModel = viewModel;' + "`r`n        " + '_serviceProvider = serviceProvider;' + "`r`n        " + 'InitializeComponent();'
          $patched = [regex]::Replace($text, $pattern, $replacement, 1)
          if ($patched -eq $text) { throw 'MainWindow hotfix was not applied.' }
          [System.IO.File]::WriteAllText($file, $patched, [System.Text.UTF8Encoding]::new($false))

      - name: Build, test, publish, smoke-test and create installer
        shell: pwsh
        run: |
          Set-Location "$env:GITHUB_WORKSPACE\buildsrc"
          .\scripts\build-installer.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SanTechSmetaPro-Windows-Installer-v2.0.0
          path: |
            buildsrc/artifacts/installer/SanTechSmetaPro-Setup-v2.0.0.exe
            buildsrc/artifacts/installer/BUILD_REPORT.txt
            buildsrc/artifacts/installer/SMOKE_TEST_REPORT.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SanTechSmetaPro-win-x64-portable-v2.0.0
          path: buildsrc/artifacts/win-x64/**
          if-no-files-found: error
          retention-days: 14
